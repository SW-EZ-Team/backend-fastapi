[project]
name = "backend-fastapi"
version = "0.1.0"
description = "SW-EZ-Team FastAPI 백엔드"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "celery==5.4.0",
    "redis==5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
