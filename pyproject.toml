[project]
name = "backend-fastapi"
version = "0.1.0"
description = "SW-EZ-Team FastAPI 백엔드"
requires-python = "==3.12.*"
dependencies = [
    "anthropic==0.85.0",
    "asyncpg==0.31.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "celery==5.4.0",
    "redis==5.2.0",
    "llama-cpp-python==0.3.2",
    "jinja2==3.1.4",
    "httpx==0.27.2",
    "langgraph==1.1.6",
    "loguru==0.7.3",
    "matplotlib==3.9.2",
    "modal==1.3.3",
    "nh3==0.2.18",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# importlib 모드: 각 테스트 파일을 독립 모듈로 로드해 패키지 __init__.py 체인 실행을 방지
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
