[project]
name = "backend-fastapi"
version = "0.1.0"
description = "SW-EZ-Team FastAPI 백엔드"
requires-python = "==3.12.*"
dependencies = [
    "anthropic==0.85.0",
    "boto3==1.43.19",
    "google-genai>=1.10.0",
    "asyncpg==0.31.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "celery==5.4.0",
    "redis==5.2.0",
    "jinja2==3.1.4",
    "httpx>=0.28.1",
    "langgraph==1.1.6",
    "loguru==0.7.3",
    "matplotlib==3.9.2",
    "modal==1.3.3",
    "nh3==0.2.18",
    "python-dotenv==1.2.2",
    "pyloudnorm>=0.2.0",
    "jiwer==3.1.0",
    "numpy>=1.26.0",
    "librosa==0.11.0",
    "python-multipart==0.0.20",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.49",
    "qdrant-client==1.13.3",
    "scipy==1.15.0",
    "soundfile==0.12.1",
    "openai==2.41.1",
]

[project.optional-dependencies]
# Mac MLX 네이티브 TTS/ASR 모델 (GPU 추론용 — 로컬 개발 전용)
tts = [
    "mlx>=0.30.4",
    "mlx-lm>=0.31.1",
    "mlx-audio==0.4.2",
    "mlx-whisper==0.4.3",
    "mlx-qwen3-asr @ git+https://github.com/moona3k/mlx-qwen3-asr.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ai_connectors", "common"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

# marker-pdf와 magic-pdf는 공식 타입 스텁(.pyi)을 제공하지 않는 선택적 OCR 라이브러리다.
# 두 패키지가 설치되지 않은 환경에서도 모듈 로드가 가능하도록 지연 임포트를 사용하며,
# 스텁 부재로 인한 import-untyped 오류를 프로젝트 수준에서 일괄 허용한다.
[[tool.mypy.overrides]]
module = ["marker", "marker.*", "magic_pdf", "magic_pdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# importlib 모드: 각 테스트 파일을 독립 모듈로 로드해 패키지 __init__.py 체인 실행을 방지
addopts = "--import-mode=importlib"
# backend-fastapi 루트를 sys.path에 명시 고정. 이렇게 하면 어느 디렉터리에서 수집해도
# 루트의 common/ 패키지(common.llm_output 등)와 app/ 패키지가 일관되게 import된다.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: 실제 ML 모델을 호출하는 무거운 통합 테스트",
]
