name: FastAPI CD Dev

on:
  push:
    branches: [develop]

env:
  DEPLOY_PATH: /opt/ezteam/backend-fastapi
  DOCKER_TAG: dev-latest

permissions:
  contents: read

concurrency:
  group: fastapi-cd-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.dev.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_FILE
          script: |
            cd /opt/ezteam/backend-fastapi

            printf "%s" "$ENV_FILE" > .env
            printf "\nDOCKER_USERNAME=%s\n" "${{ secrets.DOCKER_USERNAME }}" >> .env
            printf "DOCKER_REPO=%s\n" "${{ secrets.DOCKER_REPO }}" >> .env
            printf "DOCKER_TAG=%s\n" "${{ env.DOCKER_TAG }}" >> .env

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
              --username "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ezteam-fastapi-api 2>/dev/null || true)
              if [ "$STATUS" = "healthy" ]; then
                curl -fsS http://127.0.0.1:8000/health
                docker compose -f docker-compose.dev.yml exec -T api python -c 'import os, redis; redis.Redis.from_url(os.environ["REDIS_URL"]).ping()'
                docker image prune -f
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "FastAPI container became unhealthy" >&2
                docker compose -f docker-compose.dev.yml ps
                docker compose -f docker-compose.dev.yml logs --tail=120 api
                exit 1
              fi

              sleep 5
            done

            echo "FastAPI container did not become healthy in time" >&2
            docker compose -f docker-compose.dev.yml ps
            docker compose -f docker-compose.dev.yml logs --tail=120 api
            exit 1
