<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASR V1 — 실시간 대화형 전사 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    h2 { font-size: 1.1rem; margin: 20px 0 8px; color: #444; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
    .status-row {
      display: flex; gap: 16px; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .led {
      width: 14px; height: 14px; border-radius: 50%;
      display: inline-block; margin-right: 6px;
    }
    .led-off { background: #ccc; }
    .led-connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .led-speaking { background: #f44336; box-shadow: 0 0 6px #f44336; animation: pulse 0.8s infinite; }
    .led-silence  { background: #9e9e9e; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    button {
      padding: 8px 18px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 0.95rem; font-weight: 600;
    }
    .btn-start  { background: #2196f3; color: #fff; }
    .btn-stop   { background: #f44336; color: #fff; }
    .btn-off    { background: #ddd; color: #888; cursor: not-allowed; }
    .btn-upload { background: #607d8b; color: #fff; }
    .transcript-box {
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 16px; min-height: 80px; margin-bottom: 16px;
    }
    .partial-text { color: #9e9e9e; font-style: italic; }
    .final-text   { color: #111; font-weight: 700; }
    .history-list {
      list-style: none; padding: 0;
      max-height: 220px; overflow-y: auto;
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
    }
    .history-list li {
      padding: 8px 14px; border-bottom: 1px solid #f0f0f0;
      font-size: 0.92rem;
    }
    .history-list li:last-child { border-bottom: none; }
    .settings-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .settings-grid label { font-size: 0.88rem; color: #555; }
    .settings-grid input[type=range] { width: 100%; }
    .settings-grid input[type=number],
    .settings-grid input[type=text] {
      width: 80px; padding: 4px 6px;
      border: 1px solid #ccc; border-radius: 4px;
    }
    .range-val { font-weight: 700; color: #2196f3; }
    .offline-section {
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 16px; margin-top: 20px;
    }
    .offline-result {
      margin-top: 12px; padding: 12px; background: #f9f9f9;
      border-radius: 6px; font-size: 0.92rem; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>ASR V1 — 실시간 대화형 전사 테스트</h1>
  <p class="subtitle">AudioWorklet 기반 16kHz PCM + Silero VAD + 배치 ASR 파이프라인</p>

  <div class="status-row">
    <span>
      <span class="led led-off" id="ws-led"></span>
      <strong id="ws-status">미연결</strong>
    </span>
    <span>
      <span class="led led-off" id="vad-led"></span>
      <strong id="vad-status">VAD 대기</strong>
    </span>
    <button class="btn-start" id="btn-start" onclick="startRecording()">녹음 시작</button>
    <button class="btn-off" id="btn-stop" onclick="stopRecording()" disabled>녹음 중지</button>
  </div>

  <h2>실시간 전사</h2>
  <div class="transcript-box">
    <span class="partial-text" id="partial-display">발화를 기다리는 중...</span>
    <br/>
    <span class="final-text" id="final-display"></span>
  </div>

  <h2>플러시 세그먼트 (LLM→TTS 전달 준비)</h2>
  <div class="transcript-box" id="flush-display" style="font-size:0.9rem; color:#1565c0;"></div>

  <h2>턴 히스토리</h2>
  <ul class="history-list" id="history-list">
    <li id="history-empty" style="color:#bbb;">턴이 없습니다.</li>
  </ul>

  <h2>VAD 파라미터 설정</h2>
  <div class="settings-grid">
    <div>
      <label>VAD 임계값: <span class="range-val" id="val-vad-threshold">0.5</span></label>
      <input type="range" id="vad-threshold" min="0.1" max="0.9" step="0.05" value="0.5"
             oninput="document.getElementById('val-vad-threshold').textContent=this.value">
    </div>
    <div>
      <label>최소 침묵(ms):
        <input type="number" id="min-silence-ms" value="800" min="200" step="50">
      </label>
    </div>
    <div>
      <label>최소 글자수:
        <input type="number" id="turn-min-chars" value="2" min="1" step="1">
      </label>
    </div>
    <div>
      <label>언어 코드:
        <input type="text" id="language" value="ko">
      </label>
    </div>
  </div>

  <div class="offline-section">
    <h2>오프라인 전사 (레퍼런스 오디오 업로드)</h2>
    <input type="file" id="offline-file" accept="audio/*" />
    <button class="btn-upload" style="margin-left:8px;" onclick="offlineTranscribe()">전사 실행</button>
    <div class="offline-result" id="offline-result" style="display:none;"></div>
  </div>

<script>
/* ── 상수 ─────────────────────────────────────────────────────────────────── */
const WS_URL = 'ws://localhost:8011/ws/asr-v1';
const OFFLINE_URL = 'http://localhost:8011/api/asr-v1/offline';
const TARGET_SR = 16000;

/* ── 전역 상태 ────────────────────────────────────────────────────────────── */
let ws = null;
let audioContext = null;
let workletNode = null;
let mediaStream = null;
let turnCount = 0;

/* ── AudioWorklet 프로세서 (blob URL로 등록) ─────────────────────────────── */
const WORKLET_CODE = `
class PCMProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const input = inputs[0];
    if (!input || !input[0]) return true;
    const f32 = input[0];
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      i16[i] = s < 0 ? s * 32768 : s * 32767;
    }
    this.port.postMessage(i16.buffer, [i16.buffer]);
    return true;
  }
}
registerProcessor('pcm-processor', PCMProcessor);
`;

/* ── WebSocket 연결 ────────────────────────────────────────────────────────── */
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    setLed('ws-led', 'led-connected');
    setText('ws-status', '연결됨');
  };
  ws.onmessage = (ev) => handleServerMessage(JSON.parse(ev.data));
  ws.onclose = () => {
    setLed('ws-led', 'led-off');
    setText('ws-status', '미연결');
    setLed('vad-led', 'led-off');
  };
}

/* ── 서버 메시지 처리 ──────────────────────────────────────────────────────── */
function handleServerMessage(msg) {
  if (msg.type === 'vad_state') {
    if (msg.speaking) {
      setLed('vad-led', 'led-speaking');
      setText('vad-status', '발화 중');
    } else {
      setLed('vad-led', 'led-silence');
      setText('vad-status', '침묵');
    }
  } else if (msg.type === 'partial') {
    setText('partial-display', msg.text || '');
  } else if (msg.type === 'final') {
    setText('partial-display', '');
    setText('final-display', msg.text);
    addTurnHistory(msg);
  } else if (msg.type === 'flush') {
    setText('flush-display', (msg.segments || []).join('\n'));
  } else if (msg.type === 'error') {
    setText('partial-display', '오류: ' + msg.detail);
  }
}

/* ── 턴 히스토리 추가 (DOM 메서드만 사용) ─────────────────────────────────── */
function addTurnHistory(msg) {
  turnCount++;
  const emptyEl = document.getElementById('history-empty');
  if (emptyEl) emptyEl.remove();

  const li = document.createElement('li');

  const numSpan = document.createElement('strong');
  numSpan.textContent = '#' + turnCount + ' ';

  const textSpan = document.createElement('span');
  textSpan.textContent = msg.text;

  const metaSpan = document.createElement('span');
  metaSpan.style.cssText = 'font-size:0.75rem; color:#aaa; margin-left:8px;';
  metaSpan.textContent =
    msg.duration_sec.toFixed(1) + '초 / ' + msg.latency_ms.toFixed(0) + 'ms';

  li.appendChild(numSpan);
  li.appendChild(textSpan);
  li.appendChild(metaSpan);

  const list = document.getElementById('history-list');
  list.prepend(li);
}

/* ── 녹음 시작 ────────────────────────────────────────────────────────────── */
async function startRecording() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioContext = new AudioContext({ sampleRate: TARGET_SR });

    const blob = new Blob([WORKLET_CODE], { type: 'application/javascript' });
    const blobUrl = URL.createObjectURL(blob);
    await audioContext.audioWorklet.addModule(blobUrl);
    URL.revokeObjectURL(blobUrl);

    workletNode = new AudioWorkletNode(audioContext, 'pcm-processor');
    const source = audioContext.createMediaStreamSource(mediaStream);
    source.connect(workletNode);

    workletNode.port.onmessage = (ev) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(ev.data);
      }
    };

    connectWS();
    setButtonState(true);
  } catch (err) {
    alert('마이크 접근 실패: ' + err.message);
  }
}

/* ── 녹음 중지 ────────────────────────────────────────────────────────────── */
function stopRecording() {
  if (ws) {
    ws.send(JSON.stringify({ action: 'stop' }));
    ws.close();
    ws = null;
  }
  if (workletNode) { workletNode.disconnect(); workletNode = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }
  setButtonState(false);
  setText('vad-status', 'VAD 대기');
}

/* ── 오프라인 전사 ────────────────────────────────────────────────────────── */
async function offlineTranscribe() {
  const fileInput = document.getElementById('offline-file');
  if (!fileInput.files.length) {
    alert('오디오 파일을 선택하세요.');
    return;
  }
  const lang = document.getElementById('language').value || 'ko';
  const formData = new FormData();
  formData.append('audio', fileInput.files[0]);

  const resultEl = document.getElementById('offline-result');
  resultEl.style.display = 'block';
  resultEl.textContent = '전사 중...';

  try {
    const resp = await fetch(
      OFFLINE_URL + '?language=' + encodeURIComponent(lang),
      { method: 'POST', body: formData }
    );
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    resultEl.textContent =
      '전사 결과: ' + data.text +
      '\n모델: ' + data.model +
      '\n길이: ' + data.duration_sec.toFixed(2) + '초' +
      ' / 지연: ' + data.latency_ms.toFixed(0) + 'ms';
  } catch (err) {
    resultEl.textContent = '오류: ' + err.message;
  }
}

/* ── 유틸 함수 ────────────────────────────────────────────────────────────── */
function setLed(id, className) {
  const el = document.getElementById(id);
  if (el) el.className = 'led ' + className;
}

function setText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

function setButtonState(recording) {
  const start = document.getElementById('btn-start');
  const stop = document.getElementById('btn-stop');
  if (recording) {
    start.disabled = true;
    start.className = 'btn-off';
    stop.disabled = false;
    stop.className = 'btn-stop';
  } else {
    start.disabled = false;
    start.className = 'btn-start';
    stop.disabled = true;
    stop.className = 'btn-off';
  }
}
</script>
</body>
</html>
