<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChapterStudio 수동 테스트</title>
  <style>
    :root {
      color-scheme: light;
      --surface-page:#F9F8F3; --surface-card:#FFFDF7; --surface-strong:#FFFFFF; --surface-subtle:#F4F0E5; --text-primary:#1F2A30; --text-secondary:#55646C; --text-tertiary:#7B878B; --text-muted:#9FA8AA;
      --border-default:#DED8CA; --border-soft:#ECE6D8; --accent-primary:#207B4C; --accent-strong:#36B36F; --accent-soft:#E7F3E8; --state-danger:#C2425B; --state-danger-bg:#FDECEF; --state-warning:#FEE87E; --state-warning-bg:#FEF8E7;
      --code-bg:#1B1E26; --code-border:#2A2F3A; --syn-keyword:#FF9BA3; --syn-fn:#7ED1E5; --syn-string:#B8E099; --font-sans:"Pretendard Variable",Pretendard,Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; --shadow-md:0 4px 14px -8px rgba(28,32,20,.08),0 1px 2px rgba(28,32,20,.03);
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:var(--font-sans); color:var(--text-primary); background:var(--surface-page); }
    button, input, select { font: inherit; }
    button { cursor:pointer; border:0; }
    .app { max-width:1540px; margin:0 auto; padding:24px 28px 48px; }
    .topbar { display:flex; align-items:flex-start; gap:18px; margin-bottom:20px; }
    .brand-mark { width:4px; height:44px; border-radius:2px; background:var(--accent-primary); margin-top:3px; }
    h1 { margin:0; font-size:26px; line-height:1.2; letter-spacing:0; font-weight:760; }
    .sub { margin:7px 0 0; font-size:13px; line-height:1.6; color:var(--text-secondary); }
    .status { margin-left:auto; padding:7px 11px; border:1px solid var(--border-default); border-radius:10px; color:var(--text-secondary); background:var(--surface-card); font-size:12px; font-weight:800; }
    .layout { display:grid; grid-template-columns:340px minmax(0,1fr); gap:18px; align-items:start; }
    .control { position:sticky; top:18px; max-height:calc(100vh - 36px); overflow:auto; padding:18px; border:1px solid var(--border-default); border-radius:12px; background:var(--surface-card); box-shadow:var(--shadow-md); }
    .control-title { font-size:12px; font-weight:800; margin-bottom:14px; color:var(--text-primary); }
    .field { display:grid; gap:6px; margin-bottom:12px; }
    label { font-size:12px; font-weight:700; color:var(--text-tertiary); }
    input, select { width:100%; min-height:40px; border:1px solid var(--border-default); border-radius:8px; padding:8px 10px; color:var(--text-primary); background:var(--surface-strong); }
    input:focus, select:focus { outline:2px solid var(--accent-soft); border-color:var(--accent-primary); }
    .slider-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .run { position:sticky; bottom:0; width:100%; min-height:42px; border-radius:8px; color:var(--surface-card); background:var(--accent-primary); font-weight:760; box-shadow:var(--shadow-md); }
    .run:disabled { opacity:.55; cursor:default; }
    .timeline { display:grid; gap:8px; margin-top:14px; }
    .step { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--border-default); border-radius:10px; background:var(--surface-strong); color:var(--text-tertiary); font-size:12px; }
    .step::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--border-default); }
    .step.done { color:var(--accent-primary); background:var(--accent-soft); border-color:#ADD87B; font-weight:800; }
    .step.done::before { background:var(--accent-strong); }
    .result { display:grid; gap:16px; min-height:720px; }
    .empty { padding:32px; border:1px dashed var(--border-default); border-radius:12px; background:var(--surface-card); color:var(--text-secondary); }
    .summary { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:12px; padding:16px; border:1px solid var(--border-default); border-radius:12px; background:var(--surface-card); box-shadow:var(--shadow-md); }
    .summary h2 { margin:0; font-size:20px; letter-spacing:0; }
    .quality { display:grid; gap:7px; margin:12px 0 0; padding:0; list-style:none; color:var(--text-secondary); font-size:13px; line-height:1.55; }
    .quality li { padding-left:14px; position:relative; }.quality li::before { content:""; position:absolute; left:0; top:.72em; width:5px; height:5px; border-radius:50%; background:var(--accent-primary); }
    .tool-plan { display:grid; gap:8px; padding:12px; }.tool-row { display:grid; grid-template-columns:110px 210px minmax(0,1fr) 130px; gap:10px; align-items:start; padding:10px; border:1px solid var(--border-soft); border-radius:10px; background:var(--surface-strong); color:var(--text-secondary); font-size:12px; line-height:1.55; }.tool-row strong { color:var(--text-primary); }
    .metric { border:1px solid var(--border-soft); border-radius:12px; padding:12px; background:var(--surface-subtle); }
    .metric strong { display:block; font-size:23px; letter-spacing:0; }
    .panel { overflow:hidden; border:1px solid var(--border-default); border-radius:12px; background:var(--surface-card); box-shadow:var(--shadow-md); }
    .panel-head { display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border-soft); }
    .panel-head h2 { margin:0; font-size:16px; letter-spacing:0; }
    .pill { display:inline-flex; align-items:center; min-height:22px; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent-primary); font-size:11px; font-weight:760; }
    .slides { display:grid; grid-template-columns:minmax(0,1fr); gap:18px; padding:16px; max-width:1040px; margin:0 auto; }
    .slide-card { overflow:hidden; width:100%; border:1px solid var(--border-soft); border-radius:14px; background:var(--surface-strong); }
    .slide-title { padding:14px 16px; border-bottom:1px solid var(--border-soft); }
    .slide-title h3 { margin:0; font-size:16px; line-height:1.35; }
    .slide-meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px 14px; padding:12px 16px; border-bottom:1px solid var(--border-soft); background:var(--surface-page); color:var(--text-secondary); font-size:12px; line-height:1.45; }
    iframe { width:100%; min-height:520px; border:0; display:block; background:var(--surface-card); }
    .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:12px; }
    .grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding:12px; }
    .mini { padding:13px; border:1px solid var(--border-soft); border-radius:12px; background:var(--surface-strong); }
    .mini h3 { margin:0 0 8px; font-size:14px; line-height:1.35; }
    .mini p, .mini li { margin:6px 0; font-size:13px; line-height:1.6; color:var(--text-secondary); }
    .quiz-question ol { margin:8px 0 0; padding-left:20px; }.quiz-answer { margin-top:10px; border:1px solid var(--border-soft); border-radius:10px; background:var(--surface-page); padding:9px 10px; }.quiz-answer summary { cursor:pointer; color:var(--accent-primary); font-size:12px; font-weight:800; }.answer { color:var(--accent-primary); font-weight:800; }
    .storage-table { width:100%; border-collapse:collapse; font-size:13px; }
    .storage-table th, .storage-table td { padding:10px 12px; border-top:1px solid var(--border-soft); text-align:left; vertical-align:top; }
    .storage-table th { color:var(--text-tertiary); font-size:11px; }
    @media (max-width:1080px) { .layout { grid-template-columns:1fr; } .control { position:static; } .summary, .slides, .grid2, .grid3, .tool-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark"></div>
      <div>
        <h1>ChapterStudio_V1 생성 테스트</h1>
        <p class="sub">프론트 입력 계약을 반영해 슬라이드, 퀴즈, 핵심노트, 과제, 음성대본을 분리 검증한다.</p>
      </div>
      <div class="status" id="status">대기 중</div>
    </header>
    <div class="layout">
      <section class="control">
        <div class="control-title">생성 입력</div>
        <div class="field"><label for="topic">주제</label><input id="topic" value="LangGraph 상태 그래프" maxlength="80"></div>
        <div class="field"><label for="sourceMode">입력 모드</label><select id="sourceMode"><option value="topic">주제 입력</option><option value="pdf">PDF 업로드 mock</option></select></div>
        <div class="field"><label for="pdfFileName">PDF 파일명 mock</label><input id="pdfFileName" value="정보처리기사_실기_2026.pdf" maxlength="160"></div>
        <div class="field"><label for="engine">생성 모드</label><select id="engine"><option value="codex_cli">실제 Codex CLI OAuth</option><option value="mock">빠른 mock 검증</option></select></div>
        <div class="field"><label for="template">출력 템플릿</label><select id="template"><option value="concept_code">개념 + 코드</option></select></div>
        <div class="field"><label for="durationDays">학습 기간</label><select id="durationDays"><option value="14">14일</option><option value="30" selected>30일</option><option value="60">60일</option><option value="90">90일</option></select></div>
        <div class="field"><label for="depth">난이도 · 깊이</label><select id="depth"><option value="basic">기초 중심</option><option value="normal" selected>표준</option><option value="deep">심화·예외까지</option></select></div>
        <div class="field"><label for="teacher">AI 선생님</label><select id="teacher"><option value="owl">올빼미 교수</option><option value="cat">냥 튜터</option><option value="fox">여우 선배</option><option value="bear">곰 코치</option></select></div>
        <div class="field"><label for="learningGoal">학습 목표</label><input id="learningGoal" value="핵심 개념 이해와 실습" maxlength="160"></div>
        <div class="field"><label for="audienceLevel">대상 수준</label><input id="audienceLevel" value="초중급 학습자" maxlength="80"></div>
        <div class="field"><label for="weakPoints">취약점 mock</label><input id="weakPoints" value="개념과 코드 연결이 약함" maxlength="240"></div>
        <div class="field"><label>튜터 슬라이더 mock</label><div class="slider-grid"><input id="tone" type="number" min="0" max="100" value="55" title="친근도"><input id="pace" type="number" min="0" max="100" value="45" title="속도"><input id="tutorDepth" type="number" min="0" max="100" value="70" title="깊이"><input id="socratic" type="number" min="0" max="100" value="80" title="질문우선"></div></div>
        <button class="run" id="runBtn" type="button">1강 · 5장 생성</button>
        <div class="timeline" id="timeline"></div>
      </section>
      <section class="result" id="output">
        <article class="empty">생성하면 커리큘럼 중 강의 1개, 슬라이드 5장, 강의 끝 퀴즈 5개, 핵심노트, 과제, 음성대본, DB 저장 매핑이 분리 표시된다.</article>
      </section>
    </div>
  </main>
  <script>
    const stepSets = {
      mock: ["Agent 입력 분석","AI 템플릿·도구 선택","Mock 생성 도구 실행","후처리·보안 렌더","퀴즈·노트·대본 분리","DB 저장 매핑 조립"],
      codex_cli: ["Agent 입력 분석","AI 템플릿·도구 선택","Codex CLI 도구 실행","후처리·보안 렌더","퀴즈·노트·대본 분리","DB 저장 매핑 조립"]
    };
    const timeline = document.querySelector("#timeline");
    const output = document.querySelector("#output");
    const statusEl = document.querySelector("#status");
    const runBtn = document.querySelector("#runBtn");
    const apiBase = location.protocol === "file:" ? "http://127.0.0.1:8800" : "";
    const e = (value) => String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    function resetTimeline() {
      timeline.innerHTML = "";
      stepSets[document.querySelector("#engine").value].forEach((step) => {
        const item = document.createElement("div");
        item.className = "step";
        item.textContent = step;
        timeline.appendChild(item);
      });
    }
    async function loadContract() {
      const response = await fetch(`${apiBase}/demo/chapter-studio/contract`);
      const data = await response.json();
      document.querySelector("#template").innerHTML = data.templates.map((item) => `<option value="${e(item.value)}">${e(item.label)}</option>`).join("");
    }
    function markStep(node) {
      [...timeline.children].forEach((item) => {
        if (item.textContent === node) item.classList.add("done");
      });
    }
    function renderResult(data) {
      output.innerHTML = [summaryPanel(data), agentPlanPanel(data), slidesPanel(data), notePanel(data), quizPanel(data), assignmentPanel(data), voicePanel(data), storagePanel(data)].join("");
    }
    function summaryPanel(data) {
      return `<article class="summary"><div><span class="pill">${e(data.template_label)}</span><h2>${e(data.topic)}</h2><ul class="quality">${data.quality_marks.map((x) => `<li>${e(x)}</li>`).join("")}</ul></div><div class="metric"><strong>${data.slides.length}</strong><span>슬라이드</span><hr><strong>${data.quizzes.length}</strong><span>분리 퀴즈</span></div></article>`;
    }
    function agentPlanPanel(data) { const timeout = data.timeout_policy ? `${data.timeout_policy.engine} · ${data.timeout_policy.limit_sec}s · ${data.timeout_policy.policy}` : "timeout 정책 없음"; return `<article class="panel"><div class="panel-head"><h2>LangGraph agent 도구 선택</h2><span class="pill">${e(timeout)}</span></div><div class="tool-plan">${(data.agent_plan || []).map((x) => `<div class="tool-row"><strong>${e(x.stage)}</strong><span>${e(x.tool)}</span><span>${e(x.reason)}</span><span>${e(x.output)}</span></div>`).join("")}</div></article>`; }
    function slidesPanel(data) {
      return `<article class="panel"><div class="panel-head"><h2>슬라이드 5개</h2><span class="pill">srcdoc 끼워넣기</span></div><div class="slides">${data.slides.map((s) => `<article class="slide-card"><div class="slide-title"><h3>${e(s.title)}</h3></div><div class="slide-meta"><div>템플릿 역할: ${e(s.template_role)}</div><div>카테고리: ${e(s.category)}</div><div>학습초점: ${e(s.focus)}</div><div>자가점검: ${e(s.checkpoint)}</div></div><iframe sandbox="allow-scripts" title="${e(s.title)}" srcdoc="${e(s.iframe_html)}"></iframe></article>`).join("")}</div></article>`;
    }
    function notePanel(data) {
      return `<article class="panel"><div class="panel-head"><h2>핵심노트</h2><span class="pill">블록 파싱</span></div><div class="grid2">${data.note_blocks.map((b) => `<div class="mini"><h3>${e(b.heading)}</h3><ul>${b.bullets.map((x) => `<li>${e(x)}</li>`).join("")}</ul></div>`).join("")}</div></article>`;
    }
    function quizPanel(data) {
      return `<article class="panel"><div class="panel-head"><h2>강의 끝 퀴즈 5개</h2><span class="pill">문제와 정답 분리</span></div><div class="grid2">${data.quizzes.map((q, i) => `<div class="mini"><div class="quiz-question"><h3>Q${i + 1}. ${e(q.question)} <span class="pill">${e(q.difficulty)}</span></h3><ol>${q.choices.map((c) => `<li>${e(c)}</li>`).join("")}</ol></div><details class="quiz-answer"><summary>정답과 해설 보기</summary><p class="answer">정답: ${q.answer_idx + 1}. ${e(q.choices[q.answer_idx])}</p><p>${e(q.explanation)}</p></details></div>`).join("")}</div></article>`;
    }
    function assignmentPanel(data) {
      return `<article class="panel"><div class="panel-head"><h2>과제</h2><span class="pill">20분 단위</span></div><div class="grid2"><div class="mini"><h3>${e(data.assignment.title)}</h3><ol>${data.assignment.steps.map((x) => `<li>${e(x)}</li>`).join("")}</ol></div><div class="mini"><h3>채점 기준</h3><ul>${data.assignment.rubric.map((x) => `<li>${e(x)}</li>`).join("")}</ul></div></div></article>`;
    }
    function voicePanel(data) {
      return `<article class="panel"><div class="panel-head"><h2>음성대본</h2><span class="pill">TTS 큐 입력</span></div><div class="grid3">${data.voice_scripts.map((v) => `<div class="mini"><h3>Slide ${v.slide_idx + 1}</h3><p>${e(v.script_text)}</p></div>`).join("")}</div></article>`;
    }
    function storagePanel(data) {
      return `<article class="panel"><div class="panel-head"><h2>DB 저장 매핑 미리보기</h2><span class="pill">Phase 5 연결 예정</span></div><table class="storage-table"><thead><tr><th>테이블</th><th>행</th><th>저장 내용</th></tr></thead><tbody>${data.storage_preview.map((x) => `<tr><td>${e(x.table)}</td><td>${x.rows}</td><td>${e(x.note)}</td></tr>`).join("")}</tbody></table></article>`;
    }
    function params() {
      const ids = ["topic","engine","template","sourceMode","pdfFileName","durationDays","depth","teacher","learningGoal","audienceLevel","weakPoints","tone","pace","tutorDepth","socratic"];
      const values = Object.fromEntries(ids.map((id) => [id, document.querySelector(`#${id}`).value.trim()]));
      return new URLSearchParams({
        topic: values.topic, slide_count: "5", engine: values.engine, template: values.template,
        source_mode: values.sourceMode, pdf_file_name: values.pdfFileName, duration_days: values.durationDays,
        depth: values.depth, teacher: values.teacher, learning_goal: values.learningGoal, audience_level: values.audienceLevel,
        weak_points: values.weakPoints, tone: values.tone, pace: values.pace, tutor_depth: values.tutorDepth, socratic: values.socratic
      }).toString();
    }
    function run() {
      resetTimeline();
      output.innerHTML = `<article class="empty">생성 중이다. 강의 1개 안에 5장 슬라이드, 강의 끝 퀴즈, 노트, 과제를 분리 구성한다.</article>`;
      statusEl.textContent = "생성 중";
      runBtn.disabled = true;
      const events = new EventSource(`${apiBase}/demo/chapter-studio/stream?${params()}`);
      events.addEventListener("node_complete", (event) => markStep(JSON.parse(event.data).node));
      events.addEventListener("complete", (event) => {
        renderResult(JSON.parse(event.data));
        statusEl.textContent = "완료";
        runBtn.disabled = false; output.scrollIntoView({ behavior: "smooth", block: "start" });
        events.close();
      });
      events.addEventListener("error", (event) => {
        const data = event.data ? JSON.parse(event.data) : {message: "연결 오류"};
        statusEl.textContent = "오류";
        output.innerHTML = `<article class="empty">${e(data.message)}</article>`;
        runBtn.disabled = false;
        events.close();
      });
      events.onerror = () => {
        statusEl.textContent = "오류";
        runBtn.disabled = false;
        events.close();
      };
    }
    resetTimeline();
    loadContract().catch((err) => { statusEl.textContent = "계약 로드 실패"; console.warn(err); });
    document.querySelector("#engine").addEventListener("change", resetTimeline);
    runBtn.addEventListener("click", run);
  </script>
</body>
</html>
