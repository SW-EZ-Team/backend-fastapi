<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChapterStudio 참고도서 OCR 컨텍스트 테스트</title>
  <style>
    :root{--paper:#FAFAF8;--ink:#1F2A30;--muted:#59666E;--line:#E4DED1;--green:#207B4C;--blue:#2A3B45}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,Inter,system-ui,-apple-system,sans-serif}
    main{max-width:980px;margin:0 auto;padding:28px 18px}
    h1{margin:0 0 8px;font-size:24px;line-height:1.3}
    p{color:var(--muted);line-height:1.65}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    textarea,input{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:8px;background:#FFFDF7;color:var(--ink);font:inherit}
    input{height:40px;padding:0 12px}
    textarea{min-height:260px;padding:12px;line-height:1.55}
    button{height:42px;border:0;border-radius:8px;background:var(--blue);color:#FFFDF7;font-weight:800;padding:0 16px;cursor:pointer}
    button:hover{background:var(--green)}
    label{display:block;margin:14px 0 6px;font-weight:800}
    pre{min-height:260px;white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;background:#FFFDF7;padding:12px;line-height:1.55}
    .row{display:flex;gap:10px;align-items:center;margin-top:14px}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <h1>참고도서 OCR 컨텍스트 테스트</h1>
    <p>OCR 결과의 페이지 텍스트가 강의 생성용 참고도서 발췌로 줄어드는지 확인한다. 실제 생성 흐름에는 선택된 page 근거만 들어간다.</p>
    <label for="topic">강의 주제</label>
    <input id="topic" value="회귀분석 잔차 해석" />
    <div class="grid">
      <section>
        <label for="payload">OCR 결과 JSON</label>
        <textarea id="payload"></textarea>
      </section>
      <section>
        <label for="result">컨텍스트 결과</label>
        <pre id="result">대기 중</pre>
      </section>
    </div>
    <div class="row">
      <button id="run">컨텍스트 만들기</button>
      <span id="status"></span>
    </div>
  </main>
  <script>
    const sample = {
      pages: [
        {page_num: 12, text: "표지와 저자 소개"},
        {page_num: 88, text: "회귀분석에서 잔차는 관측값과 예측값의 차이를 뜻한다. 잔차 패턴은 모델이 놓친 구조를 보여준다."},
        {page_num: 104, text: "p-value는 귀무가설 아래에서 현재 통계량 이상이 관측될 확률이다."}
      ],
      ocr_model: "paddleocr-ppv4"
    };
    const payload = document.querySelector("#payload");
    const result = document.querySelector("#result");
    const status = document.querySelector("#status");
    payload.value = JSON.stringify(sample, null, 2);
    document.querySelector("#run").addEventListener("click", async () => {
      status.textContent = "요청 중";
      try {
        const res = await fetch("/demo/chapter-studio/reference-book/context-preview", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            topic: document.querySelector("#topic").value,
            chapter_brief: "잔차를 모델 진단 관점으로 이해한다.",
            learning_goal: "잔차 패턴과 실전 해석을 연결한다.",
            weak_points: "잔차와 오차 구분",
            source_title: "사용자 참고도서",
            ocr_result: JSON.parse(payload.value)
          })
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
        status.textContent = res.ok ? "완료" : `오류 ${res.status}`;
      } catch (err) {
        result.textContent = String(err);
        status.textContent = "실패";
      }
    });
  </script>
</body>
</html>
