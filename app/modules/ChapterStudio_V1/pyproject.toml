[project]
name = "chapterstudio-v1"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.1.6",
    "langchain-anthropic==1.4.0",
    "vllm==0.6.4; platform_system == 'Linux'",
    "asyncpg==0.31.0",
    "nh3==0.2.18",
    "pydantic==2.13.3",
    "fastapi==0.136.0",
    "uvicorn[standard]==0.43.0",
    "loguru==0.7.3",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.27.2",
    "python-dotenv==1.2.2",
    "modal==1.3.3",
    "mypy==1.13.0",
    "SQLAlchemy==2.0.49",
    "anthropic==0.85.0",
    "matplotlib==3.9.2",
    "respx==0.21.1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["app", "common", "ai_connectors", "pipeline", "schemas", "db", "design_system", "postprocess", "validators", "deploy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "loguru.*", "modal", "modal.*", "anthropic", "anthropic.*", "matplotlib", "matplotlib.*", "nh3", "respx", "langgraph", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
