[project]
name = "mockexam-v1"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.1.6",
    "pydantic==2.13.3",
    "fastapi==0.136.0",
    "uvicorn[standard]==0.43.0",
    "python-dotenv==1.2.2",
    "httpx==0.27.2",
    "anthropic==0.85.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["app", "common", "pipeline", "schemas", "templates", "quality", "prompts"]

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

# 주의: ExamForge가 backend-fastapi로 마이그레이션된 뒤에는 pytest를 backend 루트에서
# 실행해 루트 pyproject.toml 설정을 사용한다. 과거 standalone 샌드박스 시절의
# nested pythonpath=["."] 는 모듈 로컬 common/ 패키지를 top-level `common`으로 노출시켜
# 루트 common/(common.llm_output)을 가려버리는 이름 충돌을 일으켰다. 그래서 제거한다.
# (이 블록은 ExamForge 디렉터리에서 단독으로 pytest를 돌릴 때만 참조되며, 마이그레이션
#  이후의 정상 실행 경로는 backend-fastapi 루트에서의 수집이다.)
