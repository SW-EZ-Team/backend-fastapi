[project]
name = "mockexam-v1"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.1.6",
    "pydantic==2.13.3",
    "fastapi==0.136.0",
    "uvicorn[standard]==0.43.0",
    "python-dotenv==1.2.2",
    "httpx==0.27.2",
    "anthropic==0.85.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["app", "common", "pipeline", "schemas", "templates", "quality", "prompts"]

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
